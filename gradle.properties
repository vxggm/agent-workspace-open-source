# ⚠ 本机总内存 3.6GB，实际 available 常年在 1.0–1.3GB。
# 之前设 -Xmx4096m / 2048m 都会因为拿不到内存被系统杀（表现为构建闪退）。
# 1536m 是这台机器能给 R8 的上限，再大就轮到 swap 抖动。
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=384m -XX:+UseSerialGC -Dfile.encoding=UTF-8

android.useAndroidX=true
kotlin.code.style=official

# ---- 并发与 daemon 限制（闪退的次要原因） ----
# 曾经同时存活 19 个 daemon，每个都吃内存 → 必然 OOM。
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.daemon.idletimeout=60000

org.gradle.caching=true

# ⚠ R8 全量模式做激进全局优化，低内存 ARM 上极易被杀。
# 关掉退到兼容模式，内存和时间都省一半以上。
android.enableR8.fullMode=false

android.sync.suppressAgpWarnings=UNSUPPORTED_PROJECT_OPTION_USE